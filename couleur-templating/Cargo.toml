[package]
name = "couleur-templating"
version = "0.1.0"
edition = "2024"

[dependencies]
fern = { version = "0.7.1", features = ["chrono", "colored"] }
iocore = "3.1.0"
log = { version = "0.4.33", features = ["std", "serde"] }
pest = { version = "2.8.8", features = ["pretty-print"] }
pest_derive = "2.8.8"
sanitation = "1.0.3"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.4"

[dev-dependencies]
k9 = "0.12.0"
